<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cake Details - Jannat Bakehouse</title>

    <!-- Style Link -->
    <link rel="stylesheet" href="style.css" />

    <!-- Icon & Fonts -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="cakelogo.jpeg" type="image/png" />
  </head>
  <body>
    <!-- Navbar -->
    <header class="header">
      <div class="logo">
        <a href="index.html">The <span id="pink">Jannat</span> Bakehouse</a>
      </div>
      <nav class="navbar">
        <a href="index.html">Home</a>
        <a href="index.html#menu">Menu</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <div class="icon"><i class="fa-solid fa-bars"></i></div>
    </header>

    <!-- Product Details Section -->
    <section class="details" id="details">
      <div class="details-container">
        <!-- Left Side: Image -->
        <div class="details-img">
          <!-- Default image placeholder -->
          <img src="hero png.png" id="MainImg" alt="Cake Image" />
        </div>

        <!-- Right Side: Content -->
        <div class="details-content">
          <h4 class="category">Home / Menu / Cake Details</h4>
          <h2 id="cakeName">Loading...</h2>
          <h3 id="cakePrice">0 Tk</h3>

          <div class="description">
            <h3>Cake Details</h3>
            <p id="cakeDetails">Loading details...</p>
          </div>

          <!-- Options Select -->
          <div class="options">
            <div class="weight">
              <span>Weight: </span>
              <select id="weightSelect">
                <option value="0.5">0.5 Pound (Half Pound)</option>
                <option value="1" selected>1 Pound</option>
                <option value="1.5">1.5 Pounds</option>
                <option value="2">2 Pounds</option>
                <option value="3">3 Pounds</option>
                <option value="4">4 Pounds</option>
                <option value="5">5 Pounds</option>
              </select>
            </div>
            <div class="flavor">
              <span>Flavor: </span>
              <select id="flavorSelect">
                <option value="Vanilla">Vanilla (Regular)</option>
                <option value="Chocolate">Chocolate (+50tk)</option>
                <option value="Red Velvet">Red Velvet (+100tk)</option>
                <option value="Black Forest">Strawberry (+80tk)</option>
              </select>
            </div>
          </div>

          <!-- Order Button -->
          <!-- ডিফল্ট লিংক দেওয়া হলো, কিন্তু JS এটা আপডেট করবে -->
          <a href="#" class="btn-order" id="whatsappBtn" target="_blank">
            <i class="fa-brands fa-whatsapp"></i> Order on WhatsApp
          </a>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <section class="footer">
      <div class="credit">
        Created by <span>Sadi Muhammad</span> | All Rights Reserved
      </div>
    </section>

    <!-- Scripts -->
    <script src="script.js"></script>
  </body>
</html>
